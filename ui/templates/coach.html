<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FootballVision — Coach Mode</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    /* ── Layout ── */
    .coach-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      gap: 0;
    }

    /* ── Top bar ── */
    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: rgba(10,10,20,0.95);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .topbar-brand { font-weight: 700; font-size: 1rem; color: var(--primary); letter-spacing: 0.04em; }
    .topbar-badge { font-size: 0.7rem; background: var(--primary); color: #fff; border-radius: 4px; padding: 2px 7px; margin-left: 8px; }
    .topbar-controls { display: flex; gap: 10px; align-items: center; }
    .btn-sm {
      padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
      background: var(--bg-glass); color: var(--text-primary);
    }
    .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: #e55a28; color: #fff; }
    .btn-danger { background: var(--error); border-color: var(--error); color: #fff; display: none; }
    .btn-danger:hover { background: #d93446; color: #fff; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
    #status-dot.live { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    /* ── Main video area ── */
    .video-panel {
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .video-overlay {
      position: absolute;
      top: 12px; left: 12px;
      display: flex; gap: 8px;
    }
    .chip {
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      backdrop-filter: blur(8px);
    }
    .chip.highlight { border-color: var(--primary); color: var(--primary); }
    #no-signal {
      position: absolute;
      text-align: center;
      color: var(--text-muted);
    }
    #no-signal h3 { font-size: 1.1rem; margin-bottom: 6px; }
    #no-signal p { font-size: 0.8rem; }

    /* ── Right sidebar ── */
    .sidebar {
      background: rgba(10,10,20,0.98);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px 14px;
      gap: 14px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    .card-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Formation card */
    .formation-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
    }
    .formation-conf {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .formation-alts { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .formation-alt-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--text-secondary); }
    .formation-alt-bar { flex: 1; height: 4px; background: var(--bg-glass); border-radius: 2px; }
    .formation-alt-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }

    /* Play prediction card */
    .prob-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .prob-label { width: 36px; font-size: 0.75rem; color: var(--text-secondary); }
    .prob-bar-wrap { flex: 1; height: 8px; background: var(--bg-glass); border-radius: 4px; }
    .prob-bar { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .prob-bar.run { background: var(--warning); }
    .prob-bar.pass { background: var(--secondary); }
    .prob-pct { width: 36px; text-align: right; font-size: 0.75rem; font-weight: 600; }

    /* Alerts */
    .alert-list { display: flex; flex-direction: column; gap: 6px; min-height: 40px; }
    .alert-item {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3);
      border-radius: var(--radius-sm); padding: 7px 10px;
      font-size: 0.75rem; color: #ff4757; animation: fadeIn 0.3s;
    }
    .alert-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4757; flex-shrink: 0; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; } }
    .no-alerts { font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 10px 0; }

    /* Tendency chart */
    .tendency-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .tendency-label { width: 52px; font-size: 0.72rem; color: var(--text-secondary); }
    .tendency-wrap { flex: 1; height: 6px; background: var(--bg-glass); border-radius: 3px; }
    .tendency-fill { height: 100%; border-radius: 3px; transition: width 0.6s; }
    .tendency-fill.run { background: var(--warning); }
    .tendency-fill.pass { background: var(--secondary); }
    .tendency-pct { width: 32px; text-align: right; font-size: 0.72rem; color: var(--text-muted); }

    /* Play log */
    .play-log { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
    .play-log-entry {
      display: flex; gap: 8px; align-items: center;
      font-size: 0.72rem; color: var(--text-secondary);
      padding: 5px 8px; border-radius: 6px;
      background: var(--bg-glass);
    }
    .play-log-num { color: var(--primary); font-weight: 700; min-width: 18px; }
    .play-log-type { color: var(--secondary); font-weight: 600; }
    .play-log-form { color: var(--text-muted); }

    /* Player count */
    .player-count-row { display: flex; gap: 16px; }
    .pcount { text-align: center; flex: 1; }
    .pcount-val { font-size: 1.6rem; font-weight: 700; }
    .pcount-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  </style>
</head>
<body>
<div class="coach-layout">

  <!-- Top bar -->
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="topbar-brand">FootballVision</span>
      <span class="topbar-badge">COACH</span>
      <div id="status-dot"></div>
      <span id="status-text" style="font-size:0.75rem;color:var(--text-muted)">Offline</span>
    </div>
    <div class="topbar-controls">
      <span id="frame-counter" style="font-size:0.72rem;color:var(--text-muted)">Frame —</span>
      <button class="btn-sm btn-primary" id="btn-start">Start Session</button>
      <button class="btn-sm btn-danger" id="btn-stop">Stop</button>
      <button class="btn-sm" onclick="location.href='/'">← Home</button>
    </div>
  </header>

  <!-- Live video -->
  <main class="video-panel">
    <div id="no-signal">
      <h3>No Signal</h3>
      <p>Press <strong>Start Session</strong> to begin analysis</p>
    </div>
    <img id="video-canvas" style="display:none" alt="Live feed" />
    <div class="video-overlay">
      <span class="chip highlight" id="fps-chip">— fps</span>
      <span class="chip" id="play-chip">Play #—</span>
    </div>
  </main>

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Formation -->
    <div class="card">
      <div class="card-title">Formation Detected</div>
      <div class="formation-name" id="formation-name">—</div>
      <div class="formation-conf" id="formation-conf">Confidence: —</div>
      <div class="formation-alts" id="formation-alts"></div>
    </div>

    <!-- Play prediction -->
    <div class="card">
      <div class="card-title">Play Prediction</div>
      <div class="prob-row">
        <span class="prob-label">Run</span>
        <div class="prob-bar-wrap"><div class="prob-bar run" id="bar-run" style="width:50%"></div></div>
        <span class="prob-pct" id="pct-run">50%</span>
      </div>
      <div class="prob-row">
        <span class="prob-label">Pass</span>
        <div class="prob-bar-wrap"><div class="prob-bar pass" id="bar-pass" style="width:50%"></div></div>
        <span class="prob-pct" id="pct-pass">50%</span>
      </div>
    </div>

    <!-- Alerts -->
    <div class="card">
      <div class="card-title">Live Alerts</div>
      <div class="alert-list" id="alert-list">
        <div class="no-alerts">No alerts</div>
      </div>
    </div>

    <!-- Player count -->
    <div class="card">
      <div class="card-title">Players Tracked</div>
      <div class="player-count-row">
        <div class="pcount">
          <div class="pcount-val" id="pcount-total" style="color:var(--primary)">—</div>
          <div class="pcount-lbl">Total</div>
        </div>
        <div class="pcount">
          <div class="pcount-val" id="pcount-plays" style="color:var(--secondary)">—</div>
          <div class="pcount-lbl">Plays</div>
        </div>
      </div>
    </div>

    <!-- Tendency -->
    <div class="card">
      <div class="card-title">Opponent Tendency</div>
      <div class="tendency-row">
        <span class="tendency-label">Run</span>
        <div class="tendency-wrap"><div class="tendency-fill run" id="tend-run" style="width:50%"></div></div>
        <span class="tendency-pct" id="tend-run-pct">—</span>
      </div>
      <div class="tendency-row">
        <span class="tendency-label">Pass</span>
        <div class="tendency-wrap"><div class="tendency-fill pass" id="tend-pass" style="width:50%"></div></div>
        <span class="tendency-pct" id="tend-pass-pct">—</span>
      </div>
    </div>

    <!-- Play log -->
    <div class="card">
      <div class="card-title">Play Log</div>
      <div class="play-log" id="play-log">
        <div style="font-size:0.72rem;color:var(--text-muted);text-align:center;padding:10px 0">No plays yet</div>
      </div>
    </div>

  </aside>
</div>

<script src="/static/js/coach.js"></script>
</body>
</html>
